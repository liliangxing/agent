[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-scheduling-mcp"
version = "1.0.0"
description = "MES <-> AI scheduling agent <-> ERP bridge exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "liliangxing" }]
keywords = ["mcp", "mes", "erp", "scheduling", "manufacturing", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Model Context Protocol",
    "Topic :: Scientific/Engineering :: Manufacturing",
]
dependencies = [
    "mcp>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mes-mcp = "mes_scheduling_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]